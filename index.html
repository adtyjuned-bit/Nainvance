<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fanbase Web - Official Hub</title>

  <!-- =========================================================================
       1. EXTERNAL LIBRARIES & FONTS
       =========================================================================
       Ganti/tambah font di sini jika ingin mengubah gaya tulisan web.
  -->
  <!-- Tailwind CSS (Library Styling) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Orbitron (Headings/Futuristic) & Rajdhani (Body Text) -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Rajdhani:wght@600&display=swap" rel="stylesheet">

  <!-- File CSS Eksternal milik kita (Kustom Desain) -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-[#05050a] text-white min-h-screen flex flex-col items-center justify-between relative overflow-hidden font-rajdhani">

  <!-- =========================================================================
       2. MODUL: CINEMATIC LOADING SCREEN
       =========================================================================
       Fungsi: Menampilkan animasi pembuka sebelum user masuk ke halaman utama.
       Untuk edit teks status, kecepatan, atau durasi -> Edit di js/main.js
  -->
  <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center">
    
    <!-- Pintu Atas (Transisi Terbelah) -->
    <div class="gate-top absolute top-0 left-0 w-full h-1/2 bg-[#05050a] cyber-grid border-b border-[#00f0ff]/20 z-0"></div>
    
    <!-- Pintu Bawah (Transisi Terbelah) -->
    <div class="gate-bottom absolute bottom-0 left-0 w-full h-1/2 bg-[#05050a] cyber-grid border-t border-[#00f0ff]/20 z-0"></div>

    <!-- Konten di Tengah Loading Screen -->
    <div id="loading-content" class="relative z-10 flex flex-col items-center w-full max-w-md px-6 transition-opacity duration-500">
      
      <!-- Logo / Inisial Fanbase -->
      <!-- [EDIT DI SINI]: Ganti "FANBASE" dengan Nama/Brand Kamu -->
      <div class="relative mb-6">
        <div class="absolute -inset-4 rounded-full bg-[#00f0ff]/20 blur-xl animate-pulse"></div>
        <h1 id="logo" class="font-orbitron text-6xl md:text-7xl font-black tracking-widest neon-text-cyan glitch-effect select-none">
          FAN<span class="text-white">BASE</span>
        </h1>
      </div>

      <!-- Teks Status & Persentase -->
      <div class="flex items-center justify-between w-full mb-2 text-sm text-[#00f0ff]/80 tracking-wider font-semibold">
        <span id="status-text">INITIALIZING SYSTEM...</span>
        <span id="percentage-text" class="font-orbitron text-white">0%</span>
      </div>

      <!-- Progress Bar Loading -->
      <div class="w-full h-2 bg-[#0a1128] rounded-full overflow-hidden p-[1px] border border-[#00f0ff]/30 shadow-[0_0_10px_rgba(0,240,255,0.2)]">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-[#00f0ff] via-[#7000ff] to-[#ff007f] w-0 transition-all duration-100 ease-out rounded-full"></div>
      </div>

      <!-- Footer Teks Kecil Loading Screen -->
      <!-- [EDIT DI SINI]: Informasi Tambahan / Tagline Kamu -->
      <p class="mt-4 text-xs text-gray-500 tracking-widest uppercase">
        Secured Connection • Cyber Hub v1.0
      </p>
    </div>
  </div>


  <!-- =========================================================================
       3. MODUL: MAIN CONTENT (HALAMAN UTAMA)
       =========================================================================
       Fungsi: Tempat semua fitur utama web berada setelah loading selesai.
  -->
  <main class="relative z-0 text-center px-4 my-auto py-12">
    
    <!-- Title / Hero Text -->
    <!-- [EDIT DI SINI]: Judul Selamat Datang -->
    <h2 class="font-orbitron text-4xl md:text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-600 mb-4">
      WELCOME TO THE HUB
    </h2>
    
    <!-- Subtitle / Deskripsi -->
    <!-- [EDIT DI SINI]: Penjelasan Singkat Web Fanbase Kamu -->
    <p class="text-gray-400 max-w-lg mx-auto text-lg mb-8">
      Satu platform untuk Story, Activity Feed, Leaderboard Donasi, dan konten eksklusif.
    </p>

    <!-- Tombol Test / Demo -->
    <button id="btn-restart" class="px-6 py-3 bg-[#00f0ff]/10 border border-[#00f0ff] text-[#00f0ff] font-orbitron font-bold rounded-lg hover:bg-[#00f0ff] hover:text-black transition-all shadow-[0_0_15px_rgba(0,240,255,0.4)]">
      RESTART LOADING
    </button>
  </main>


  <!-- =========================================================================
       4. EXTERNAL JAVASCRIPT
       =========================================================================
       Pemasangan script ditaruh di paling bawah agar HTML ter-render sempurna lebih dulu.
       defer = Memastikan JS berjalan setelah seluruh struktur HTML selesai dibaca.
  -->
  <script src="js/main.js" defer></script>
</body>
</html>
