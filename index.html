<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fanbase Web - Official Hub</title>

  <!-- =========================================================================
       1. EXTERNAL LIBRARIES & FONTS
       =========================================================================
       Ganti/tambah font di sini jika ingin mengubah gaya tulisan web.
  -->
  <!-- Tailwind CSS (Library Styling) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Orbitron (Headings/Futuristic) & Rajdhani (Body Text) -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Rajdhani:wght@600&display=swap" rel="stylesheet">

  <!-- File CSS Eksternal milik kita (Kustom Desain) -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-[#05050a] text-white min-h-screen flex flex-col items-center justify-between relative overflow-hidden font-rajdhani">


      <!-- =========================================================================
       2. MODUL: JAPANESE STREAMER LOADING SCREEN (WITH CUSTOM CHARACTER & BG)
       =========================================================================
       [PEMBATAS EDIT]: Tampilan Loading dengan Avatar & Background Karakter Kamu
  -->
  <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0d0b18] overflow-hidden select-none font-rajdhani">
    
    <!-- =======================================================================
         BACKGROUND KARAKTER (Bisa diatur Blur & Opacity-nya)
         =======================================================================
         [GANTI GAMBAR KARAKTER KAMU DI SINI]: Taruh URL / path file gambar karakter di 'src'
    -->
    <!-- 1. BACKGROUND KARAKTER (Sudah diubah z-[1] dan opacity-40) -->
<div class="absolute inset-0 z-[1] pointer-events-none overflow-hidden">
  <img src="nainvance.png" 
       alt="Character Background" 
       class="w-full h-full object-cover object-center opacity-80 blur-sm scale-105">
  
  <div class="absolute inset-0 bg-gradient-to-t from-[#0d0b18] via-[#0d0b18]/40 to-[#0d0b18]/80"></div>
</div>


    <!-- Pattern Dots Overlay -->
    <div class="absolute inset-0 z-0 opacity-10 bg-[radial-gradient(#00f0ff_1px,transparent_1px)] [background-size:20px_20px] pointer-events-none"></div>

    <!-- Pintu Transisi Atas (Slide Up) -->
    <div class="gate-top absolute top-0 left-0 w-full h-1/2 bg-[#0d0b18] border-b border-[#00f0ff]/20 z-0"></div>
    
    <!-- Pintu Transisi Bawah (Slide Down) -->
    <div class="gate-bottom absolute bottom-0 left-0 w-full h-1/2 bg-[#0d0b18] border-t border-[#00f0ff]/20 z-0"></div>

    <!-- Central Streamer Waiting Card -->
    <div id="loading-content" class="relative z-10 flex flex-col items-center w-full max-w-sm px-6 text-center transition-opacity duration-500">
      
      <!-- Top Japanese Waiting Badge -->
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 backdrop-blur-md border border-white/15 text-gray-200 text-[10px] font-bold font-orbitron tracking-widest mb-6 shadow-lg">
        <span class="w-2 h-2 rounded-full bg-[#ff66c4] animate-ping"></span>
        配信待機中 • STREAM WAITING ROOM
      </div>

      <!-- =======================================================================
           AVATAR / KARAKTER UTAMA DI TENGAH
           =======================================================================
           [GANTI GAMBAR KARAKTER KAMU DI SINI]: Taruh URL / path file gambar karakter di 'src'
      -->
      <div class="relative w-32 h-32 mb-5 group">
        <div class="absolute -inset-1 rounded-3xl bg-gradient-to-tr from-[#ff66c4] via-[#00f0ff] to-purple-500 blur-sm opacity-80 group-hover:opacity-100 transition duration-500"></div>
        <div class="relative w-full h-full rounded-3xl p-1 bg-[#0d0b18] overflow-hidden border border-white/20 shadow-2xl">
          <img src="nainvance.png" 
               alt="My Character Avatar" 
               class="w-full h-full object-cover object-top rounded-2xl">
        </div>
      </div>

      <!-- Channel / Branding Title -->
      <!-- [EDIT DI SINI]: Ganti dengan Nama Channel Kamu -->
      <h1 class="font-orbitron text-3xl md:text-4xl font-black tracking-wider text-white uppercase leading-none mb-1 drop-shadow-md">
        LIVE <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#00f0ff] to-[#ff66c4]">PORTAL</span>
      </h1>

      <p class="font-orbitron text-[11px] text-[#00f0ff] font-bold tracking-[0.4em] uppercase mb-6 drop-shadow">
        エンターテインメント
      </p>

      <!-- Sleek Progress Section -->
      <div class="w-full space-y-2">
        
        <!-- Status Label & Percentage -->
        <div class="flex justify-between items-end font-orbitron text-xs">
          <span id="status-text" class="text-gray-300 font-medium text-[10px] tracking-wider">
            SYSTEM LOADING... 読み込み中
          </span>
          <span id="percentage-text" class="text-[#ff66c4] font-black text-sm italic">
            0%
          </span>
        </div>

        
 
    

  <!-- =========================================================================
       4. EXTERNAL JAVASCRIPT
       =========================================================================
       Pemasangan script ditaruh di paling bawah agar HTML ter-render sempurna lebih dulu.
       defer = Memastikan JS berjalan setelah seluruh struktur HTML selesai dibaca.
  -->
  <script src="js/main.js" defer></script>
        
      
</body>
</html>
