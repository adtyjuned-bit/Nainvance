<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAISAN HUB - Stream Portal</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts Import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <!-- File CSS Eksternal -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-[#0d0b18] text-white min-h-screen overflow-x-hidden font-rajdhani">

      <!-- =========================================================================
       MODUL 1: LOADING SCREEN (FIX BACKGROUND LANGSUNG KELIATAN)
       ========================================================================= -->
  <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center overflow-hidden select-none transition-opacity duration-700">

    <!-- Layer 1: Background Utama (Paling Belakang / z-0) -->
    <div class="absolute inset-0 z-0 overflow-hidden bg-[#0d0b18]">
      <img src="nainvance.png" alt="Character BG" class="w-full h-full object-cover object-center opacity-60 blur-[2px] scale-105">
      <!-- Dark Overlay Tipis Supaya Teks Tetap Jelas -->
      <div class="absolute inset-0 bg-[#0d0b18]/50"></div>
    </div>

    <!-- Layer 2: Pintu Transisi Gate (Diubah jadi semi-transparan / z-10) -->
    <div class="gate-top absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-[#0d0b18]/90 via-[#0d0b18]/40 to-transparent border-b border-[#00f0ff]/40 z-10 transition-transform duration-700 ease-in-out"></div>
    <div class="gate-bottom absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-[#0d0b18]/90 via-[#0d0b18]/40 to-transparent border-t border-[#00f0ff]/40 z-10 transition-transform duration-700 ease-in-out"></div>

    <!-- Layer 3: Konten Loading Tengah (Paling Depan / z-20) -->
    <div id="loading-content" class="relative z-20 flex flex-col items-center w-full max-w-sm px-6 text-center transition-all duration-500">

      <!-- Badge Indikator Status -->
      <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-gray-200 text-[10px] font-bold font-orbitron tracking-widest mb-6 shadow-[0_0_15px_rgba(255,102,196,0.2)]">
        <span class="w-2 h-2 rounded-full bg-[#ff66c4] animate-ping"></span>
        配信待機中 • STREAM WAITING ROOM
      </div>

      <!-- Frame Avatar Karakter -->
      <div class="relative w-32 h-32 mb-5 group">
        <div class="absolute -inset-1 rounded-3xl bg-gradient-to-tr from-[#ff66c4] via-[#00f0ff] to-purple-600 blur opacity-80 animate-pulse"></div>
        <div class="relative w-full h-full rounded-3xl p-1 bg-[#0d0b18] overflow-hidden border border-white/20">
          <img src="nainvance.png" alt="Avatar" class="w-full h-full object-cover object-top rounded-2xl">
        </div>
      </div>

      <!-- Judul / Branding Streamer -->
      <h1 class="font-orbitron text-3xl md:text-4xl font-black tracking-wider text-white uppercase leading-none mb-1">
        LIVE <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#00f0ff] to-[#ff66c4]">PORTAL</span>
      </h1>
      <p class="font-orbitron text-[11px] text-[#00f0ff] font-bold tracking-[0.4em] uppercase mb-6 drop-shadow">
        エンターテインメント
      </p>

      <!-- Progress Bar -->
      <div class="w-full space-y-2">
        <div class="flex justify-between items-end font-orbitron text-xs">
          <span id="status-text" class="text-gray-400 font-medium text-[10px] tracking-wider">SYSTEM LOADING... 読み込み中</span>
          <span id="percentage-text" class="text-[#ff66c4] font-black text-sm italic">0%</span>
        </div>
        <div class="w-full h-2 bg-black/60 p-[2px] rounded-full border border-white/10 overflow-hidden shadow-inner">
          <div id="progress-bar" class="h-full bg-gradient-to-r from-[#00f0ff] via-purple-500 to-[#ff66c4] w-0 transition-all duration-75 ease-out rounded-full shadow-[0_0_10px_#00f0ff]"></div>
        </div>
      </div>

    </div>
  </div>




  <!-- =========================================================================
       MODUL 2: MAIN DASHBOARD HUB (WADAH UTAMA KONTEN SEMENTARA KOSONG)
       Fungsi: Menampung seluruh isi halaman setelah loading screen terbuka
       ========================================================================= -->
  <main id="main-content" class="relative z-10 w-full max-w-7xl mx-auto px-4 py-8 md:py-12 space-y-8">
    <!-- Konten Dashboard akan kita rakit secara bertahap di langkah berikutnya -->
  </main>

  <!-- File JS Eksternal -->
  <script src="js/main.js" defer></script>
</body>
</html>
